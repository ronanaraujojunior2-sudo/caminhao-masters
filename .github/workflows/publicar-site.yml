# Publica a pasta web/ no GitHub Pages a cada alteração na branch main.
# O site é estático: não há senhas nem chaves secretas aqui (a única chave
# do Supabase usada no site é a pública, em web/js/config.js).
name: Publicar site (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/publicar-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir que não há chave secreta no site
        run: |
          if grep -rnE "sb_secret_|service_role\s*[:=]" web/; then
            echo "Chave secreta encontrada em web/. Publicação cancelada."; exit 1
          fi
          if grep -q "COLE_AQUI" web/js/config.js; then
            echo "web/js/config.js ainda não foi preenchido."; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  # Etapa separada (padrão recomendado pelo GitHub): só começa depois que o
  # pacote do site foi registrado, evitando o erro "No artifacts named github-pages".
  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
